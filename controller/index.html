<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b111e" />
  <title>UAV-ESP32S3 遥控器</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" class="cockpit-shell">
    <!-- ==================== 顶栏：连接 / 状态 / 电压 / 急停 ==================== -->
    <header class="hud-topbar">
      <div class="brand-group">
        <span class="status-dot" id="conn-dot"></span>
        <div class="conn-sub" id="conn-label">未连接</div>
      </div>

      <div class="state-pill state-locked" id="flight-state-pill">LOCKED (已上锁)</div>

      <div class="metric-box" id="vbat-box" title="1S 电池电压">
        <span class="metric-val" id="vbat-val">--.- V</span>
      </div>

      <div class="top-actions">
        <button id="btn-ble-connect" class="btn btn-primary" type="button">连接 BLE 飞控</button>
        <button id="btn-sim-toggle" class="btn btn-secondary" type="button">仿真</button>
        <button id="btn-fullscreen" class="btn btn-secondary" type="button" title="全屏并锁定横屏">全屏</button>
        <button id="btn-kill" class="btn btn-kill" type="button">急停</button>
      </div>
    </header>

    <!-- ==================== 主区：左摇杆 | 地平仪 + 解锁 | 右摇杆 ==================== -->
    <main class="cockpit-main">
      <!-- 左摇杆（Mode 2）：纵向油门不回中，横向偏航回中 -->
      <section class="stick-panel" id="stick-left-panel">
        <div class="stick-zone stick-zone-throttle" id="stick-left-zone">
          <div class="crosshair-h"></div>
          <div class="crosshair-v"></div>
          <div class="hover-line" title="悬停参考油门线 (~50%)"></div>
          <div class="stick-knob" id="stick-left-knob"></div>
        </div>
        <div class="stick-readout">
          <span>油门 <strong id="val-thr">0%</strong></span>
          <span>偏航 <strong id="val-yaw">0°/s</strong></span>
        </div>
      </section>

      <!-- 中央：地平仪 + 解锁 + 更多 -->
      <section class="center-console">
        <div class="horizon-wrap">
          <div class="horizon-circle">
            <div class="horizon-sky-ground" id="horizon-plate">
              <div class="horizon-line"></div>
            </div>
            <div class="horizon-cross"></div>
          </div>
          <div class="euler-grid">
            <div><span class="lbl">横滚</span><strong id="att-roll">0.0°</strong></div>
            <div><span class="lbl">俯仰</span><strong id="att-pitch">0.0°</strong></div>
            <div><span class="lbl">航向</span><strong id="att-yaw">0.0°</strong></div>
          </div>
        </div>

        <button id="btn-arm-toggle" class="btn-arm" type="button">长按 解锁</button>

        <button id="btn-settings" class="btn-more" type="button">状态 / 设置</button>
      </section>

      <!-- 右摇杆（Mode 2）：俯仰 + 横滚，松手回中 -->
      <section class="stick-panel" id="stick-right-panel">
        <div class="stick-zone" id="stick-right-zone">
          <div class="crosshair-h"></div>
          <div class="crosshair-v"></div>
          <div class="stick-knob" id="stick-right-knob"></div>
        </div>
        <div class="stick-readout">
          <span>俯仰 <strong id="val-pitch">0.0°</strong></span>
          <span>横滚 <strong id="val-roll">0.0°</strong></span>
        </div>
      </section>
    </main>

    <!-- 低频状态监测与仿真工具弹窗（Top-Layer 原生模态框，点关闭或背景遮罩即可退出） -->
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog-box">
        <header class="dialog-header">
          <h2 id="settings-title" class="dialog-title">状态监测与工具</h2>
          <button id="btn-settings-close" class="btn-close" type="button">✕ 关闭</button>
        </header>

        <div class="dialog-body">
          <div class="more-row">
            <button id="btn-zero-thr" class="btn-mode" type="button">油门一键归零</button>
          </div>

          <!-- 仅在检测到实体 USB/蓝牙手柄接入时自动显现，手机纯触屏时不打扰 -->
          <div class="gamepad-row" id="gamepad-row" hidden>
            <span id="gamepad-status" class="gp-tag">已接入实体手柄</span>
            <button id="btn-thr-mode" class="btn-mini" type="button" title="Xbox/PS 回中手柄用增量；非回中航模控用直映">油门模式: 增量</button>
          </div>

          <div class="diag-row">
            <span>发包频率 <strong id="tx-hz-val">0 Hz</strong></span>
            <span>控制环耗时 <strong id="loop-us-val">--- us</strong></span>
          </div>

          <div class="motors-grid" title="四路电机实时输出">
            <div class="motor-col"><div class="motor-bar-wrap"><div class="motor-bar" id="m4-bar"></div></div><span>M4 左前</span></div>
            <div class="motor-col"><div class="motor-bar-wrap"><div class="motor-bar" id="m1-bar"></div></div><span>M1 右前</span></div>
            <div class="motor-col"><div class="motor-bar-wrap"><div class="motor-bar" id="m3-bar"></div></div><span>M3 左后</span></div>
            <div class="motor-col"><div class="motor-bar-wrap"><div class="motor-bar" id="m2-bar"></div></div><span>M2 右后</span></div>
          </div>

          <code id="hex-frame-view">AA 55 00 00 00 00 00 00 00 00 00 00 00</code>

          <!-- 仿真故障注入（仅仿真模式显示） -->
          <div class="sim-toolbar" id="sim-toolbar" style="display: none;">
            <span>仿真测试：</span>
            <button id="sim-vbat-39" class="btn-mini" type="button">满电</button>
            <button id="sim-vbat-34" class="btn-mini" type="button">低压 3.4V</button>
            <button id="sim-vbat-32" class="btn-mini" type="button">缓降 3.2V</button>
            <button id="sim-gust-tilt" class="btn-mini" type="button">75° 阵风</button>
            <button id="sim-crash-tilt" class="btn-mini" type="button">&gt;110° 倒扣</button>
          </div>
        </div>
      </div>
    </dialog>

    <div id="alert-banner" class="alert-banner" style="display: none;"></div>

    <!-- 竖屏提示：遥控必须横屏双拇指操作 -->
    <div class="rotate-hint">请将手机横屏使用<br /><small>双拇指分别操作左右摇杆</small></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
