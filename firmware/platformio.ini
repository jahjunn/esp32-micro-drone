# .ini文件--->编译配置合同，将编译配置写在此文件中，以告诉ESP-S3指令

;【作用】:定义当前编译配置的“唯一环境名称”
[env:esp32-s3-devkitc-1] 

platform = espressif32
board = esp32-s3-devkitc-1

;【作用】:指定开发使用的软件框架是Arduino core for ESP32
framework = arduino

;【作用】:设定电脑 USB 串口监视器的通行速度为115200波特率，防止答应乱码
monitor_speed = 115200

; ---针对N16R8（16MB Flash +8MB OPI PSRAM）的硬件配置 ---
board_build.arduino.memory_type = qio_opi ; 启用 Octal PSRAM
board_build.flash_size = 16MB            ;启用16MB Flash
board_build.partitions = default_16MB.csv ;启用16MB Flash分区表

; 编译宏定义：开启 PSRAM 支持并提高串口调试等级
build_flags = 
    -std=gnu++17
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3